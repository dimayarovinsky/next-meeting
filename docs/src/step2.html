<div style="width: 1280px; height: 560px; position: relative; overflow: hidden; background: #101217; color: #eceef3; font-family: 'Bricolage Grotesque', sans-serif; -webkit-font-smoothing: antialiased;">

    <h2 style="margin: 12px 0 0; font-size: 46px; line-height: 1.02; font-weight: 700; letter-spacing: -0.03em;">Add your calendar to macOS</h2>
    <p style="margin: 0; font-size: 20px; line-height: 1.45; color: #aab0bd;">System Settings → Internet Accounts → Add Account → Google. Keep Calendars on. iCloud and Exchange calendars work too.</p>

        <span style="font-size: 14px; font-weight: 500;">Internet Accounts</span>
      </div>
      <div style="height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px;"><span style="width: 20px; height: 20px; border-radius: 5px; background: rgba(255,255,255,0.10);"></span><span style="width: 100px; height: 9px; border-radius: 5px; background: rgba(255,255,255,0.12);"></span></div>

    </div>
    <!-- pane -->
    <div style="flex-grow: 1; padding: 26px 30px; display: flex; flex-direction: column; gap: 18px;">

        <span style="width: 44px; height: 44px; border-radius: 22px; background: #eceef3; color: #1f2128; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center;">G</span>
