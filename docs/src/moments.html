<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Moments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head><body>
<div style="width: 1280px; height: 640px; position: relative; overflow: hidden; background: #101217; color: #eceef3; font-family: 'Bricolage Grotesque', sans-serif; -webkit-font-smoothing: antialiased;">

  <h2 style="position: absolute; left: 72px; top: 64px; margin: 0; width: 620px; font-size: 52px; line-height: 1.02; font-weight: 700; letter-spacing: -0.03em;">It keeps time so you don’t have to.</h2>

  <!-- time axis -->
  <div style="position: absolute; left: 72px; right: 72px; top: 548px; height: 1px; background: rgba(255,255,255,0.14);"></div>
  <div style="position: absolute; left: 72px; top: 564px; font-size: 15px; color: #7d8494; font-variant-numeric: tabular-nums;">13:59</div>
  <div style="position: absolute; left: 470px; top: 564px; font-size: 15px; color: #7d8494; font-variant-numeric: tabular-nums;">14:12</div>
  <div style="position: absolute; left: 800px; top: 564px; font-size: 15px; color: #7d8494; font-variant-numeric: tabular-nums;">14:26</div>
  <div style="position: absolute; left: 1084px; top: 564px; font-size: 15px; color: #7d8494; font-variant-numeric: tabular-nums;">14:30</div>
  <div style="position: absolute; left: 72px; top: 543px; width: 11px; height: 11px; border-radius: 6px; background: #eceef3;"></div>
  <div style="position: absolute; left: 470px; top: 543px; width: 11px; height: 11px; border-radius: 6px; background: #4f8cf7;"></div>
  <div style="position: absolute; left: 800px; top: 543px; width: 11px; height: 11px; border-radius: 6px; background: #ff9f0a;"></div>
  <div style="position: absolute; left: 1084px; top: 543px; width: 11px; height: 11px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.5); box-sizing: border-box;"></div>

  <!-- 13:59 reminder card -->
  <div style="position: absolute; left: 72px; top: 214px; width: 360px; transform: scale(1.2); transform-origin: top left; display: flex; flex-direction: column; gap: 14px;">
    <div style="border-radius: 16px; background: #2a2c33; border: 0.5px solid rgba(255,255,255,0.12); box-shadow: 0 20px 44px rgba(0,0,0,0.45); padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 12px; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;">
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1;">
        <span style="font-size: 14px; font-weight: 600;">Weekly sync</span>
        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">Starts in 1 min · Google Meet</span>
      </div>
      <span style="height: 32px; padding: 0 14px; border-radius: 9px; background: #4f8cf7; color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center;">Join</span>
      <span style="width: 28px; height: 28px; border-radius: 14px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
    </div>
    <p style="margin: 0; max-width: 300px; font-size: 18px; line-height: 1.4; color: #aab0bd;">A minute before, a card slides down with the Join link.</p>
  </div>

  <!-- 14:12 filling bar -->
  <div style="position: absolute; left: 470px; top: 300px; width: 290px; transform: scale(1.15); transform-origin: top left; display: flex; flex-direction: column; gap: 14px;">
    <div style="height: 44px; border-radius: 11px; background: #1b1e26; border: 0.5px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 11px; padding: 0 16px; width: fit-content; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 500;">
      <div style="width: 5px; height: 20px; border-radius: 3px; background: rgba(79,140,247,0.3); position: relative; overflow: hidden;"><div style="position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: #4f8cf7;"></div></div>
      <span style="white-space: nowrap;">Weekly sync · 18m left</span>
    </div>
    <p style="margin: 0; font-size: 18px; line-height: 1.4; color: #aab0bd;">The bar fills as the meeting runs.</p>
  </div>

  <!-- 14:26 orange -->
  <div style="position: absolute; left: 800px; top: 360px; width: 240px; transform: scale(1.15); transform-origin: top left; display: flex; flex-direction: column; gap: 14px;">
    <div style="height: 44px; border-radius: 11px; background: #1b1e26; border: 0.5px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 11px; padding: 0 16px; width: fit-content; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 500;">
      <div style="width: 5px; height: 20px; border-radius: 3px; background: rgba(255,159,10,0.3); position: relative; overflow: hidden;"><div style="position: absolute; left: 0; right: 0; bottom: 0; height: 90%; background: #ff9f0a;"></div></div>
      <span style="white-space: nowrap;">Weekly sync · <span style="color: #ffb340;">4m left</span></span>
    </div>
    <p style="margin: 0; font-size: 18px; line-height: 1.4; color: #aab0bd;">Orange means wrap up.</p>
  </div>

  <!-- 14:30 free -->
  <div style="position: absolute; left: 1084px; top: 420px; width: 140px; transform: scale(1.15); transform-origin: top left; display: flex; flex-direction: column; gap: 14px;">
    <div style="height: 44px; border-radius: 11px; background: #1b1e26; border: 0.5px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 11px; padding: 0 16px; width: fit-content; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; font-weight: 500; color: rgba(255,255,255,0.85);">
      <span style="white-space: nowrap;">Free · 30m</span>
    </div>
  </div>
</div>
