<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Step 1: build and install</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head><body>
<div style="width: 1280px; height: 560px; position: relative; overflow: hidden; background: #101217; color: #eceef3; font-family: 'Bricolage Grotesque', sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="position: absolute; left: 72px; top: 120px; width: 400px; display: flex; flex-direction: column; gap: 18px;">
    <span style="font-size: 96px; line-height: 0.8; font-weight: 800; color: #4f8cf7; letter-spacing: -0.04em;">1</span>
    <h2 style="margin: 12px 0 0; font-size: 46px; line-height: 1.02; font-weight: 700; letter-spacing: -0.03em;">Build and install</h2>
    <p style="margin: 0; font-size: 20px; line-height: 1.45; color: #aab0bd;">One command builds the app and puts it in Applications. You need Xcode installed.</p>
  </div>

  <!-- terminal window, running off the right and bottom -->
  <div style="position: absolute; left: 560px; top: 96px; width: 820px; height: 520px; border-radius: 14px; background: #1a1c22; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 30px 70px rgba(0,0,0,0.55);">
    <div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.06);">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #ff5f57;"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #febc2e;"></span>
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #28c840;"></span>
      <span style="margin-left: 16px; width: 90px; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.10);"></span>
    </div>
    <div style="padding: 28px 30px; display: flex; flex-direction: column; gap: 14px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 22px; line-height: 1.4;">
      <div><span style="color: #7d8494;">~ </span><span style="color: #eceef3;">cd next-meeting</span></div>
      <div><span style="color: #7d8494;">next-meeting </span><span style="color: #eceef3;">./build.sh</span></div>
      <div style="color: #34c759;">Installed /Applications/NextMeeting.app</div>
      <div><span style="color: #7d8494;">next-meeting </span><span style="display: inline-block; width: 12px; height: 24px; vertical-align: -4px; background: #eceef3;"></span></div>
    </div>
  </div>
</div>
