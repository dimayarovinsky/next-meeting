<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Step 3: allow calendar access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head><body>
<div style="width: 1280px; height: 560px; position: relative; overflow: hidden; background: #101217; color: #eceef3; font-family: 'Bricolage Grotesque', sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="position: absolute; left: 72px; top: 120px; width: 400px; display: flex; flex-direction: column; gap: 18px;">
    <span style="font-size: 96px; line-height: 0.8; font-weight: 800; color: #4f8cf7; letter-spacing: -0.04em;">3</span>
    <h2 style="margin: 12px 0 0; font-size: 46px; line-height: 1.02; font-weight: 700; letter-spacing: -0.03em;">Allow calendar access</h2>
    <p style="margin: 0; font-size: 20px; line-height: 1.45; color: #aab0bd;">Open NextMeeting and macOS asks once. The app only reads your calendar. It never changes it.</p>
  </div>

  <!-- permission dialog, large and centred in the right half -->
  <div style="position: absolute; left: 640px; top: 70px; width: 420px; transform: scale(1.18); transform-origin: top left; border-radius: 18px; background: #2a2c33; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 30px 70px rgba(0,0,0,0.55); padding: 26px 22px 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;">
    <svg width="64" height="64" viewBox="0 0 30 30" aria-hidden="true"><rect x="0.5" y="0.5" width="29" height="29" rx="8" fill="#1b1e26" stroke="rgba(255,255,255,0.14)"></rect><rect x="9" y="7" width="4" height="16" rx="2" fill="rgba(79,140,247,0.3)"></rect><rect x="9" y="14" width="4" height="9" rx="2" fill="#4f8cf7"></rect><rect x="16" y="11" width="6" height="2.5" rx="1.25" fill="#eceef3"></rect><rect x="16" y="16.5" width="4" height="2.5" rx="1.25" fill="rgba(236,238,243,0.5)"></rect></svg>
    <div style="font-size: 15px; font-weight: 700; line-height: 1.3;">“NextMeeting” would like full access to your Calendar.</div>
    <div style="font-size: 13px; line-height: 1.4; color: rgba(255,255,255,0.7);">NextMeeting shows your current and next meetings in the menu bar.</div>
    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
      <span style="height: 30px; border-radius: 8px; background: #4f8cf7; color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Allow Full Access</span>
      <span style="height: 30px; border-radius: 8px; background: rgba(255,255,255,0.10); font-size: 13px; display: flex; align-items: center; justify-content: center;">Don't Allow</span>
    </div>
  </div>
</div>
</body></html>
